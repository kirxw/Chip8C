name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04

          - name: windows-x86_64
            os: windows-latest

          - name: macos-x86_64
            os: macos-13

          - name: macos-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsdl2-dev \
            patchelf

      - name: Build Linux
        if: runner.os == 'Linux'
        run: make

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release/lib

          cp build/chip8 release/

          cp "$(ldconfig -p | awk '/libSDL2-2.0.so.0/{print $NF; exit}')" \
            release/lib/libSDL2-2.0.so.0

          patchelf \
            --set-rpath '$ORIGIN/lib' \
            release/chip8

          tar -czf chip8-linux-x86_64.tar.gz \
            -C release .

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mingw make -y

          curl -L -o SDL2.zip \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-devel-2.30.11-mingw.zip

          7z x SDL2.zip

          mv SDL2-2.30.11/x86_64-w64-mingw32 SDL2

          echo "SDL2_PATH=$GITHUB_WORKSPACE/SDL2" >> "$GITHUB_ENV"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: bash
        run: make

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir release

          cp build/chip8.exe release/
          cp SDL2/bin/SDL2.dll release/

          7z a chip8-windows-x86_64.zip ./release/*

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install sdl2

      - name: Build macOS
        if: runner.os == 'macOS'
        run: make

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release/lib

          cp build/chip8 release/

          SDL2_LIB="$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib"

          cp "$SDL2_LIB" release/lib/

          install_name_tool \
            -id "@loader_path/lib/libSDL2-2.0.0.dylib" \
            release/lib/libSDL2-2.0.0.dylib

          install_name_tool \
            -change "$SDL2_LIB" \
            "@loader_path/lib/libSDL2-2.0.0.dylib" \
            release/chip8

          tar -czf "chip8-${{ matrix.name }}.tar.gz" \
            -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*